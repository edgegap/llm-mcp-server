# Builds the self-hosted HTTP server image and pushes it to GitHub Container
# Registry, for hosts that pull it (e.g. the support agent VM). Uses the
# workflow's own GITHUB_TOKEN; no repository secrets needed.
#
# Tags pushed: sha-<commit> and main on every push to main; <version> on v* tags.
#
# Published under the repository's name, ghcr.io/edgegap/llm-mcp-server, and
# still under the old one, ghcr.io/edgegap/edgegap-mcp, so hosts that already
# pull it (the support agent VM) keep getting updates. Drop the old name once
# nothing pulls it.

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write


jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: |
            ghcr.io/edgegap/llm-mcp-server
            ghcr.io/edgegap/edgegap-mcp
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      # arm64 needs no emulation: the Dockerfile builds on $BUILDPLATFORM and
      # the target stage only copies files.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
